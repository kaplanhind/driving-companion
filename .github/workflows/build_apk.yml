name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Clean Android Structure
        run: |
          mkdir temp_build
          cd temp_build
          flutter create --platforms=android --org=com.avatar.driving app
          cp -r app/android ../
          cd ..
          rm -rf temp_build

      - name: Force CompileSdk 34
        run: |
          find android/ -name "build.gradle*" -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' {} + || true
          find android/ -name "build.gradle*" -exec sed -i 's/compileSdk = [0-9]*/compileSdk = 34/g' {} + || true
          find android/ -name "build.gradle*" -exec sed -i 's/flutter.compileSdkVersion/34/g' {} + || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: driving-companion-apk
          path: build/app/outputs/flutter-apk/*.apk
